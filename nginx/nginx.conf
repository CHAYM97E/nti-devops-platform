# Lab 10 — Nginx reverse proxy in front of Gunicorn (local stack only).
# On EKS the AWS Application Load Balancer plays this role.

upstream django_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploaded files are served straight from the shared volume.
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Prometheus metrics are for the cluster, not the public internet.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

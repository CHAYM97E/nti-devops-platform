###############################################################################
# Lab 10 — Local stack: Nginx -> Django/Gunicorn -> PostgreSQL + Redis
#
# Mirrors the AWS design:  ALB -> app pods -> RDS + Redis
#
#   docker compose up -d --build
#   open http://localhost:8080
#
# Values come from .env (copy .env.example). Never commit .env.
###############################################################################
name: nti-devops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./app
      target: runtime
      args:
        APP_VERSION: local
    image: nti-devops/app:local
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
      GUNICORN_WORKERS: "2"
    volumes:
      - mediafiles:/app/media
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - mediafiles:/app/media:ro
    ports:
      - "8080:80"   # 8080 on your laptop: port 80 often needs admin rights on Windows
    networks: [backend]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      # nginx:alpine has busybox wget, not curl
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  mediafiles:

networks:
  backend:
